name: CI Pipeline
on: [push, pull_request]

jobs:
  build_docker:
    runs-on: ubuntu-latest
    steps:
      # pull code from github onto the VM
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Build Image
        uses: docker/build-push-action@v5
        with:
          context: . 
          push: false
          tags: image-processing-pipeline:test
      - name: Debug File Structure
          run: ls -R

    
  smoke_test:
    needs: build_docker
    runs-on: ubuntu-latest
    steps:
      - name: Run Compose 
        run: docker compose up -d --build

  health_test:
    needs: smoke_test
    runs-on: ubuntu-latest
    steps:
      - name: Health Test
        run: curl localhost:8080/healthz
