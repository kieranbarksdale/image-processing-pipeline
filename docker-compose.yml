# Postgres, MinIO, Redis, your API, and your worker 

services:
  db: 
    name: image-processor
    restart: unless-stopped
    image: postgres:15
    environment: 
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - ${REDIS_PORT}:6379
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest 
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    ports:
      - ${MINIO_PORT}:9000
      - 9001:9001
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  api:
    build: 
    command: ["./api"]
    ports:
      - ${API_PORT}:8080
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
      - MINIO_HOST=minio
    depends_on:
      - db
      - redis
      - minio

  worker:
    build: .
    command: ["./worker"]
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
      - MINIO_HOST=minio
    depends_on:
      - db
      - redis
      - minio

volumes:
  postgres_data:
  redis_data:
  minio_data:
  